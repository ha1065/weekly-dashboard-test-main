AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secure Weekly Reporting Infrastructure with Clockify Integration'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
      - development
    Description: Environment name

  ClockifyAPIKey:
    Type: String
    NoEcho: true
    Description: Clockify API Key (will be stored in Secrets Manager)
    MinLength: 20

  ClockifyWorkspaceId:
    Type: String
    NoEcho: true
    Description: Clockify Workspace ID
    MinLength: 10

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS PostgreSQL database
    MinLength: 16
    AllowedPattern: ^[a-zA-Z0-9!@#$%^&*()_+\-=\[\]{};:,.<>?]*$
    ConstraintDescription: Must be at least 16 characters with mixed case, numbers, and symbols

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for private subnet 1

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for private subnet 2

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.101.0/24
    Description: CIDR block for public subnet 1

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.102.0/24
    Description: CIDR block for public subnet 2

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.r6g.large
    Description: RDS instance type

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Database storage size in GB

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
    Default: weekly-reporting-production-deployments-604775478093

  LambdaCodeKey:
    Type: String
    Description: S3 key for the Lambda deployment package
    Default: lambda/lambda-deployment-package.zip

  QuickSightUserARN:
    Type: String
    Default: ''
    Description: Optional - QuickSight user ARN for database access

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment Configuration
        Parameters:
          - Environment
      - Label:
          default: Clockify Integration
        Parameters:
          - ClockifyAPIKey
          - ClockifyWorkspaceId
      - Label:
          default: Database Configuration
        Parameters:
          - DatabasePassword
          - DBInstanceClass
          - DBAllocatedStorage
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
      - Label:
          default: Automation Configuration
        Parameters:
          - ImportSchedule
      - Label:
          default: QuickSight Configuration
        Parameters:
          - QuickSightUserARN

Resources:
  # ============================================================
  # VPC and Networking
  # ============================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-weekly-reporting-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-weekly-reporting-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-subnet-2

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-subnet-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-subnet-2

  # NAT Gateways
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-public-routes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-private-routes-1

  DefaultPrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet2

  # ============================================================
  # Security Groups
  # ============================================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for API calls
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-lambda-sg

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-database-sg

  # Add rules separately to break circular dependency
  LambdaToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
      Description: PostgreSQL to RDS

  DatabaseFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Allow from Lambda

  # Add QuickSight ingress rule if QuickSight user is specified
  DatabaseQuickSightIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasQuickSightUser
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      CidrIp: 52.23.63.224/27
      Description: QuickSight US-EAST-1 IP range

  # ============================================================
  # Secrets Manager
  # ============================================================
  ApplicationSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Environment}/weekly-reporting/secrets
      Description: Secrets for Weekly Reporting application
      SecretString: !Sub |
        {
          "clockify_api_key": "${ClockifyAPIKey}",
          "clockify_workspace_id": "${ClockifyWorkspaceId}",
          "db_password": "${DatabasePassword}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # RDS PostgreSQL Database
  # ============================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS database
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-db-subnet-group

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${Environment}-weekly-reporting
      DBName: weekly_reporting
      Engine: postgres
      EngineVersion: '15'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: postgres
      MasterUserPassword: !Ref DatabasePassword
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      MultiAZ: false
      PubliclyAccessible: false
      EnableCloudwatchLogsExports:
        - postgresql
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-weekly-reporting-db
        - Key: Environment
          Value: !Ref Environment

  # ============================================================
  # Lambda Functions
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ApplicationSecrets
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
        - PolicyName: QuickSightRefresh
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - quicksight:CreateIngestion
                  - quicksight:DescribeDataSet
                  - quicksight:ListIngestions
                Resource: !Sub arn:aws:quicksight:${AWS::Region}:${AWS::AccountId}:dataset/*
              - Effect: Allow
                Action:
                  - quicksight:UpdateAnalysis
                  - quicksight:DescribeAnalysis
                  - quicksight:DescribeAnalysisDefinition
                Resource: !Sub arn:aws:quicksight:${AWS::Region}:${AWS::AccountId}:analysis/*
        - PolicyName: SSMParameterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Environment}/weekly-reporting/*
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                  - bedrock:Converse
                  - bedrock-runtime:Converse
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-*
                  - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-*
                  - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-*
                  - arn:aws:bedrock:us-east-1:961341524729:inference-profile/*
                  - arn:aws:bedrock:us-east-2:961341524729:inference-profile/*
                  - arn:aws:bedrock:us-west-2:961341524729:inference-profile/*
        - PolicyName: SESendEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:ListEmailIdentities
                  - sesv2:SendEmail
                  - sesv2:ListEmailIdentities
                Resource: '*'

  ImportLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${Environment}-clockify-import
      Description: Import data from Clockify to RDS PostgreSQL
      Runtime: python3.11
      Handler: src.lambda_handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SECRET_NAME: !Ref ApplicationSecrets
          DB_ENDPOINT_PARAMETER: !Sub /${Environment}/weekly-reporting/db-endpoint
          DB_PORT: '5432'
          DB_NAME: 'weekly_reporting'
          DB_USER: 'report_user'
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
        # NOTE: Lambda code is deployed via scripts/update_lambda_and_apply_views.sh
        # which uploads to S3 and calls update-function-code directly.
        # A stack update will NOT overwrite the live code — it only updates config.
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Store DB endpoint in SSM Parameter Store (can be created independently)
  DBEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${Environment}/weekly-reporting/db-endpoint
      Type: String
      Value: !GetAtt Database.Endpoint.Address
      Description: RDS database endpoint address

  ImportLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-clockify-import
      RetentionInDays: 30

  # ============================================================
  # EventBridge Schedules
  #
  # ⚠️  WARNING — DEPLOYMENT RISK ⚠️
  #
  # Running `cloudformation deploy` on the `weekly-reporting-production`
  # stack will UPDATE the EventBridge rule targets to exactly match the
  # Input payloads defined below. If the live rules have been manually
  # updated with payloads that differ from this template, a stack deploy
  # will OVERWRITE those live payloads and could break scheduled imports.
  #
  # REQUIRED PRE-DEPLOY CHECK:
  #   Before any stack update, run:
  #     python scripts/check_eventbridge_targets.py
  #   This script compares all 6 live rule payloads against this template.
  #   Resolve any divergence before deploying.
  #
  # SAFE DEPLOY SEQUENCE:
  #   1. Run check_eventbridge_targets.py and compare output to this file.
  #   2. If live payloads MATCH the template → safe to deploy normally.
  #   3. If live payloads DIFFER from the template:
  #      a. Decide which version is correct (live rule or this template).
  #      b. If the live rule is correct, update this template to match, then deploy.
  #      c. If this template is correct, update the live rule first:
  #           aws events put-targets --rule <rule-name> \
  #             --targets '[{"Id":"<target-id>","Arn":"<lambda-arn>","Input":"<payload>"}]' \
  #             --profile AWSAdministratorAccess-961341524729 --region us-east-1
  #      d. Then run check_eventbridge_targets.py again to confirm parity.
  #      e. Only then run cloudformation deploy.
  #
  # RULES MANAGED HERE (all 6 must be checked before deploy):
  #   NOTE: Times use CDT (UTC-5, summer). In winter CST (UTC-6), these fire 1 hour earlier local time.
  #   Import rules (3):
  #     production-weekly-import-9am-ct    — 9:00 AM CDT Mon  (cron 0 14 ? * MON *)
  #     production-weekly-import-noon-ct   — 12:00 PM CDT Mon  (cron 0 17 ? * MON *)
  #     production-jira-daily-refresh      — 10:00 AM UTC daily (cron 0 10 ? * * *)
  #   Compliance email rules (3):
  #     production-compliance-email-930am-ct  — 9:30 AM CDT  Mon  (cron 30 14 ? * MON *)
  #     production-compliance-email-1230pm-ct — 12:30 PM CDT Mon  (cron 30 17 ? * MON *)
  #     production-compliance-email-230pm-ct  — 2:30 PM CDT  Mon  (cron 30 19 ? * MON *)
  #
  # IMPORTANT: Do NOT simplify the import payloads — the full dataset ID
  # lists are required for targeted SPICE refresh.
  # ============================================================

  # 9 AM CDT (14:00 UTC) every Monday — weekly import + SPICE refresh
  ImportScheduleRule9AM:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-weekly-import-9am-ct
      Description: Clockify weekly import at 9 AM CDT every Monday
      ScheduleExpression: 'cron(0 14 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: ImportLambdaTarget9AM
          Input: '{"mode":"weekly","weeks_back":2,"notify":true,"refresh_quicksight":true,"quicksight_dataset_ids":["kpi-weekly-snapshots-prod","ps-project-status-view","productive-utilization","clockify-missing-time-submissions-prod","clockify-missing-time-submissions","escalations-detail","ps-stage-trend","project-hours-summary-prod","project-hours-current-week-prod","mc-ticket-activity","mc-projects-at-risk","ps-projects-at-risk","time-compliance-current-week","missing-time-history"]}'

  ImportSchedulePermission9AM:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ImportScheduleRule9AM.Arn

  # 12 PM CDT (17:00 UTC) every Monday — incremental import + KPI snapshot + SPICE refresh
  ImportScheduleRuleNoon:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-weekly-import-noon-ct
      Description: Clockify incremental import + KPI snapshot at noon CDT every Monday
      ScheduleExpression: 'cron(0 17 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: ImportLambdaTargetNoon
          Input: '{"mode":"incremental","snapshot_kpis":true,"notify":true,"refresh_quicksight":true,"quicksight_dataset_ids":["kpi-weekly-snapshots-prod","ps-project-status-view","productive-utilization","clockify-missing-time-submissions-prod","clockify-missing-time-submissions","escalations-detail","ps-stage-trend","project-hours-summary-prod","project-hours-current-week-prod","mc-ticket-activity","mc-projects-at-risk","ps-projects-at-risk","time-compliance-current-week","missing-time-history"]}'

  ImportSchedulePermissionNoon:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ImportScheduleRuleNoon.Arn

  # Daily 10 AM UTC — Jira import + Jira-sourced SPICE refresh
  JiraDailyRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-jira-daily-refresh
      Description: Daily Jira import at 10 AM UTC
      ScheduleExpression: 'cron(0 10 ? * * *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: JiraDailyRefreshTarget
          Input: '{"mode":"jira_import","refresh_quicksight":true,"quicksight_dataset_ids":["ps-project-status-view","escalations-detail","mc-ticket-activity","mc-projects-at-risk","ps-projects-at-risk"]}'

  JiraDailyRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt JiraDailyRefreshRule.Arn

  # 9:30 AM CDT (14:30 UTC) every Monday — compliance email after 9am import
  ComplianceEmailRule9AM:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-compliance-email-930am-ct
      Description: Send compliance email at 9:30 AM CDT every Monday
      ScheduleExpression: 'cron(30 14 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: ComplianceEmailTarget9AM
          Input: '{"mode":"send_compliance_report","run":"morning"}'

  ComplianceEmailPermission9AM:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ComplianceEmailRule9AM.Arn

  # 12:30 PM CDT (17:30 UTC) every Monday — compliance email after noon import
  ComplianceEmailRuleNoon:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-compliance-email-1230pm-ct
      Description: Send compliance email at 12:30 PM CDT every Monday
      ScheduleExpression: 'cron(30 17 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: ComplianceEmailTargetNoon
          Input: '{"mode":"send_compliance_report","run":"noon"}'

  ComplianceEmailPermissionNoon:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ComplianceEmailRuleNoon.Arn

  # 2:30 PM CDT (19:30 UTC) every Monday — afternoon compliance email
  ComplianceEmailRuleAfternoon:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-compliance-email-230pm-ct
      Description: Send compliance email at 2:30 PM CDT every Monday
      ScheduleExpression: 'cron(30 19 ? * MON *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ImportLambdaFunction.Arn
          Id: ComplianceEmailTargetAfternoon
          Input: '{"mode":"send_compliance_report","run":"afternoon"}'

  ComplianceEmailPermissionAfternoon:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImportLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ComplianceEmailRuleAfternoon.Arn

  # ============================================================
  # CloudWatch Log Metric Filters
  # ============================================================
  SPICEErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ImportLambdaFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-clockify-import
      FilterName: weekly-reporting-spice-errors
      FilterPattern: "?\"SPICE refresh failed\" ?\"ingestion failed\" ?\"CreateIngestion error\" ?\"Failed to refresh dataset\" ?\"dataset refresh failed\""
      MetricTransformations:
        - MetricName: SPICEErrors
          MetricNamespace: WeeklyReporting
          MetricValue: "1"
          DefaultValue: 0

  ImportErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ImportLambdaFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/${Environment}-clockify-import
      FilterName: weekly-reporting-import-errors
      FilterPattern: "?ERROR ?Exception ?\"import failed\" ?\"Import failed\" ?Traceback ?\"raise \" ?CRITICAL"
      MetricTransformations:
        - MetricName: ImportErrors
          MetricNamespace: WeeklyReporting
          MetricValue: "1"
          DefaultValue: 0

  # ============================================================
  # CloudWatch Alarms
  # ============================================================
  ImportLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ImportLambdaFunction
    Properties:
      AlarmName: !Sub ${Environment}-import-lambda-errors
      AlarmDescription: Alert when import Lambda fails
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${Environment}-clockify-import
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic
      OKActions:
        - !Ref NotificationTopic

  LambdaDurationWarningAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ImportLambdaFunction
    Properties:
      AlarmName: weekly-reporting-lambda-duration-warning
      AlarmDescription: Lambda production-clockify-import is approaching 15-min timeout (duration > 800s)
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 800000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${Environment}-clockify-import
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic

  LambdaNotInvokedAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ImportLambdaFunction
    Properties:
      AlarmName: weekly-reporting-lambda-not-invoked
      AlarmDescription: Lambda had 0 invocations in last 7 days — weekly import may have been missed or EventBridge rule is disabled
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 604800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${Environment}-clockify-import
      TreatMissingData: breaching
      AlarmActions:
        - !Ref NotificationTopic

  LambdaConcurrentExecutionsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ImportLambdaFunction
    Properties:
      AlarmName: weekly-reporting-lambda-concurrent-executions
      AlarmDescription: Lambda had concurrent executions — possible duplicate EventBridge target
      MetricName: ConcurrentExecutions
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${Environment}-clockify-import
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic

  SPICEFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: SPICEErrorMetricFilter
    Properties:
      AlarmName: weekly-reporting-spice-failure
      AlarmDescription: SPICE ingestion error detected in Lambda logs — QuickSight datasets may not have refreshed
      MetricName: SPICEErrors
      Namespace: WeeklyReporting
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic

  ImportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: ImportErrorMetricFilter
    Properties:
      AlarmName: weekly-reporting-import-errors
      AlarmDescription: Error pattern detected in weekly-reporting import Lambda logs (3+ errors in 5 min)
      MetricName: ImportErrors
      Namespace: WeeklyReporting
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationTopic

  DatabaseCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Database
    Properties:
      AlarmName: !Sub ${Environment}-database-high-cpu
      AlarmDescription: Alert when database CPU is high
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub ${Environment}-weekly-reporting
      TreatMissingData: notBreaching

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Database
    Properties:
      AlarmName: !Sub ${Environment}-database-low-storage
      AlarmDescription: Alert when database storage is low
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000000000  # 5GB
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub ${Environment}-weekly-reporting
      TreatMissingData: notBreaching

  # ============================================================
  # SNS Topic for Notifications (Optional)
  # ============================================================
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${Environment}-weekly-reporting-notifications
      DisplayName: Weekly Reporting Notifications
      Tags:
        - Key: Environment
          Value: !Ref Environment

Conditions:
  HasQuickSightUser: !Not [!Equals [!Ref QuickSightUserARN, '']]

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${Environment}-vpc-id

  DatabaseEndpoint:
    Description: RDS database endpoint
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${Environment}-database-endpoint

  DatabasePort:
    Description: RDS database port
    Value: !GetAtt Database.Endpoint.Port

  SecretsManagerARN:
    Description: Secrets Manager ARN
    Value: !Ref ApplicationSecrets
    Export:
      Name: !Sub ${Environment}-secrets-arn

  LambdaFunctionARN:
    Description: Import Lambda function ARN
    Value: !GetAtt ImportLambdaFunction.Arn
    Export:
      Name: !Sub ${Environment}-import-lambda-arn

  LambdaSecurityGroupId:
    Description: Lambda security group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub ${Environment}-lambda-sg-id

  DatabaseSecurityGroupId:
    Description: Database security group ID
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub ${Environment}-database-sg-id

  NotificationTopicARN:
    Description: SNS topic ARN for notifications
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub ${Environment}-notification-topic-arn

  QuickSightConnectionString:
    Description: Connection string for QuickSight (use secrets for password)
    Value: !Sub postgresql://${Database.Endpoint.Address}:5432/weekly_reporting

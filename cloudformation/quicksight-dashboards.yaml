                Type: DATETIME
              - Name: week_end_date
                Type: DATETIME
              - Name: practice_alignment
                Type: STRING
              - Name: location
                Type: STRING
              - Name: unique_resources
                Type: INTEGER
              - Name: total_entries
                Type: INTEGER
              - Name: total_hours
                Type: DECIMAL
              - Name: billable_hours
                Type: DECIMAL
              - Name: non_billable_hours
                Type: DECIMAL
              - Name: avg_hours_per_entry
                Type: DECIMAL
      LogicalTableMap:
        WeeklySummaryLogical:
          Alias: Weekly Summary
          Source:
            PhysicalTableId: WeeklySummaryTable
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions


      ImportMode: SPICE
      PhysicalTableMap:
        ActiveResourcesTable:
          RelationalTable:
            DataSourceArn: !GetAtt ClockifyDataSource.Arn
            Schema: public
            Name: vw_active_resources
            InputColumns:
              - Name: clockify_user_id
                Type: STRING
              - Name: name
                Type: STRING
              - Name: email
                Type: STRING
              - Name: cloudelligent_title
                Type: STRING
              - Name: practice_alignment
                Type: STRING
              - Name: skill_area
                Type: STRING
              - Name: pod_assignment
                Type: STRING
              - Name: location
                Type: STRING

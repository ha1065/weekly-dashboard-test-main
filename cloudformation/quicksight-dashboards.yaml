  # ============================================================
  # Dataset 13: Missing Time Submissions View (non-compliant only — legacy, kept for backward compat)
  # ============================================================
  MissingTimeSubmissionsDataset:
    Type: AWS::QuickSight::DataSet
    DependsOn: ClockifyDataSource
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DataSetId: !Sub clockify-missing-time-submissions-${Environment}
      Name: !Sub Missing Time Submissions (${Environment})
      ImportMode: SPICE
      PhysicalTableMap:
        MissingTimeSubmissionsTable:
          CustomSql:
            DataSourceArn: !GetAtt ClockifyDataSource.Arn
            Name: MissingTimeSubmissions
            # Use custom SQL to explicitly cast last_updated_time to TEXT (QuickSight doesn't support TIME type)
            SqlQuery: >-
              SELECT clockify_user_id, name, email, pod_assignment, practice_alignment,
              skill_area, location, daily_capacity, weekly_expected_hours, hours_submitted,
              entries_submitted, submission_status, week_start_date, last_updated_date,
              last_updated_time::TEXT AS last_updated_time
              FROM public.vw_missing_time_submissions
            Columns:
              - Name: clockify_user_id
                Type: STRING
              - Name: name
                Type: STRING
              - Name: email
                Type: STRING
              - Name: pod_assignment
                Type: STRING
              - Name: practice_alignment
                Type: STRING
              - Name: skill_area
                Type: STRING
              - Name: location
                Type: STRING
              - Name: daily_capacity
                Type: DECIMAL
              - Name: weekly_expected_hours
                Type: DECIMAL
              - Name: hours_submitted
                Type: DECIMAL
              - Name: entries_submitted
                Type: INTEGER
              - Name: submission_status
                Type: STRING
              - Name: week_start_date
                Type: DATETIME
              - Name: last_updated_date
                Type: DATETIME
              - Name: last_updated_time
                Type: STRING
      LogicalTableMap:
        MissingTimeSubmissionsLogical:
          Alias: Missing Time Submissions
          Source:
            PhysicalTableId: MissingTimeSubmissionsTable
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions

  # ============================================================
  # Dataset 14: Weekly Compliance Report (all staff + submission_status — replaces missing-time for COO dashboard)
  # ============================================================
  WeeklyComplianceReportDataset:
    Type: AWS::QuickSight::DataSet
    DependsOn: ClockifyDataSource
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DataSetId: !Sub time-compliance-current-week-${Environment}
      Name: !Sub Weekly Compliance Report (${Environment})
      ImportMode: SPICE
      PhysicalTableMap:
        WeeklyComplianceReportTable:
          CustomSql:
            DataSourceArn: !GetAtt ClockifyDataSource.Arn
            Name: WeeklyComplianceReport
            SqlQuery: >-
              SELECT employee_name, pod_assignment, practice_alignment, skill_area,
              cloudelligent_title, location, employment_designation,
              weekly_expected_hours, hours_submitted, entry_count,
              submission_status, is_compliant, week_start_date,
              last_updated_date, last_updated_time::TEXT AS last_updated_time
              FROM public.vw_weekly_compliance_report
            Columns:
              - Name: employee_name
                Type: STRING
              - Name: pod_assignment
                Type: STRING
              - Name: practice_alignment
                Type: STRING
              - Name: skill_area
                Type: STRING
              - Name: cloudelligent_title
                Type: STRING
              - Name: location
                Type: STRING
              - Name: employment_designation
                Type: STRING
              - Name: weekly_expected_hours
                Type: DECIMAL
              - Name: hours_submitted
                Type: DECIMAL
              - Name: entry_count
                Type: INTEGER
              - Name: submission_status
                Type: STRING
              - Name: is_compliant
                Type: INTEGER
              - Name: week_start_date
                Type: DATETIME
              - Name: last_updated_date
                Type: DATETIME
              - Name: last_updated_time
                Type: STRING
      LogicalTableMap:
        WeeklyComplianceReportLogical:
          Alias: Weekly Compliance Report
          Source:
            PhysicalTableId: WeeklyComplianceReportTable
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions

  # ============================================================
  # Dashboard 1: Executive Summary Dashboard
  # ============================================================
  ExecutiveDashboard:
    Type: AWS::QuickSight::Dashboard
    DependsOn: 
      - MonthlySummaryDataset
      - PracticePerformanceDataset
      - ResourceUtilizationDataset
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DashboardId: !Sub clockify-executive-dashboard-${Environment}
      Name: !Sub Clockify Executive Dashboard (${Environment})
      Definition:
        DataSetIdentifierDeclarations:
          - DataSetArn: !GetAtt MonthlySummaryDataset.Arn
            DataSetIdentifier: monthly_summary
          - DataSetArn: !GetAtt PracticePerformanceDataset.Arn
            DataSetIdentifier: practice_performance
          - DataSetArn: !GetAtt ResourceUtilizationDataset.Arn
            DataSetIdentifier: resource_utilization
        Sheets:
          - SheetId: executive_overview
            Name: Executive Overview
            Visuals:
              - BarChartVisual:
                  VisualId: monthly_hours_by_practice
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Monthly Hours by Practice Alignment
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField:
                              FieldId: practice_alignment
                              Column:
                                DataSetIdentifier: monthly_summary
                                ColumnName: practice_alignment
                        Values:
                          - NumericalMeasureField:
                              FieldId: total_hours
                              Column:
                                DataSetIdentifier: monthly_summary
                                ColumnName: total_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: SUM
              - PieChartVisual:
                  VisualId: pod_distribution
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Hours Distribution by Pod Assignment
                  ChartConfiguration:
                    FieldWells:
                      PieChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField:
                              FieldId: pod_assignment
                              Column:
                                DataSetIdentifier: monthly_summary
                                ColumnName: pod_assignment
                        Values:
                          - NumericalMeasureField:
                              FieldId: total_hours_pod
                              Column:
                                DataSetIdentifier: monthly_summary
                                ColumnName: total_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: SUM
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDashboard
            - quicksight:ListDashboardVersions
            - quicksight:UpdateDashboardPermissions
            - quicksight:QueryDashboard
            - quicksight:UpdateDashboard
            - quicksight:DeleteDashboard
            - quicksight:DescribeDashboardPermissions
            - quicksight:ExportToCsv

  # ============================================================
  # Dashboard 4: Pod Performance Analysis Dashboard
  # ============================================================
  PodPerformanceDashboard:
    Type: AWS::QuickSight::Dashboard
    DependsOn: 
      - PodPerformanceDataset
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DashboardId: !Sub clockify-pod-performance-${Environment}
      Name: !Sub Pod Performance Analysis (${Environment})
      Definition:
        DataSetIdentifierDeclarations:
          - DataSetArn: !GetAtt PodPerformanceDataset.Arn
            DataSetIdentifier: pod_performance
        Sheets:
          - SheetId: pod_performance_overview
            Name: Pod Performance Overview
            Visuals:
              - TableVisual:
                  VisualId: pod_performance_table
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Pod Performance Summary
                  Subtitle:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Last week vs 4-week and 12-week averages with trend indicators
                  ChartConfiguration:
                    FieldWells:
                      TableAggregatedFieldWells:
                        GroupBy:
                          - CategoricalDimensionField:
                              FieldId: pod_name
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: pod_name
                        Values:
                          - NumericalMeasureField:
                              FieldId: last_week_hours
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: last_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: SUM
                          - NumericalMeasureField:
                              FieldId: avg_4_week_hours
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: avg_4_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: MAX
                          - NumericalMeasureField:
                              FieldId: avg_12_week_hours
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: avg_12_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: MAX
                          - NumericalMeasureField:
                              FieldId: pct_change_vs_4_week
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: pct_change_vs_4_week
                              AggregationFunction:
                                SimpleNumericalAggregation: MAX
                          - CategoricalDimensionField:
                              FieldId: weekly_trend
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: weekly_trend
                    TableOptions:
                      CellStyle:
                        Height: 25
                      HeaderStyle:
                        Height: 25
                        TextWrap: WRAP
              - BarChartVisual:
                  VisualId: pod_hours_comparison
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Pod Hours Comparison - Last Week vs Averages
                  ChartConfiguration:
                    FieldWells:
                      BarChartAggregatedFieldWells:
                        Category:
                          - CategoricalDimensionField:
                              FieldId: pod_name_chart
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: pod_name
                        Values:
                          - NumericalMeasureField:
                              FieldId: last_week_hours_chart
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: last_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: SUM
                          - NumericalMeasureField:
                              FieldId: avg_4_week_hours_chart
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: avg_4_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: MAX
                          - NumericalMeasureField:
                              FieldId: avg_12_week_hours_chart
                              Column:
                                DataSetIdentifier: pod_performance
                                ColumnName: avg_12_week_hours
                              AggregationFunction:
                                SimpleNumericalAggregation: MAX
                    Legend:
                      Visibility: VISIBLE
                      Position: RIGHT
              - KPIVisual:
                  VisualId: free_agent_kpi
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Free Agent Performance
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: free_agent_hours
                            Column:
                              DataSetIdentifier: pod_performance
                              ColumnName: last_week_hours
                            AggregationFunction:
                              SimpleNumericalAggregation: SUM
                      TargetValues:
                        - NumericalMeasureField:
                            FieldId: free_agent_target
                            Column:
                              DataSetIdentifier: pod_performance
                              ColumnName: avg_4_week_hours
                            AggregationFunction:
                              SimpleNumericalAggregation: MAX
                    KPIOptions:
                      Comparison:
                        ComparisonMethod: PERCENT_DIFFERENCE
                        ComparisonFormat:
                          NumberDisplayFormatConfiguration:
                            NumberScale: NONE
                            NegativeValueConfiguration:
                              DisplayMode: NEGATIVE
                      PrimaryValueDisplayType: ACTUAL
                      ProgressBar:
                        Visibility: VISIBLE
                    ConditionalFormatting:
                      ConditionalFormattingOptions:
                        - PrimaryValue:
                            TextColor:
                              Solid:
                                Expression: "IF({last_week_hours} > {avg_4_week_hours}, '#00AA00', IF({last_week_hours} < {avg_4_week_hours}, '#FF0000', '#000000'))"
              - GaugeChartVisual:
                  VisualId: trend_indicators
                  Title:
                    Visibility: VISIBLE
                    FormatText:
                      PlainText: Pod Trend Indicators
                  ChartConfiguration:
                    FieldWells:
                      Values:
                        - NumericalMeasureField:
                            FieldId: trend_value
                            Column:
                              DataSetIdentifier: pod_performance
                              ColumnName: pct_change_vs_4_week
                            AggregationFunction:
                              SimpleNumericalAggregation: MAX
                      TargetValues:
                        - NumericalMeasureField:
                            FieldId: trend_target
                            Column:
                              DataSetIdentifier: pod_performance
                              ColumnName: pct_change_vs_12_week
                            AggregationFunction:
                              SimpleNumericalAggregation: MAX
                    GaugeChartOptions:
                      PrimaryValueDisplayType: ACTUAL
                      Comparison:
                        ComparisonMethod: PERCENT_DIFFERENCE
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDashboard
            - quicksight:ListDashboardVersions
            - quicksight:UpdateDashboardPermissions
            - quicksight:QueryDashboard
            - quicksight:UpdateDashboard
            - quicksight:DeleteDashboard
            - quicksight:DescribeDashboardPermissions
            - quicksight:ExportToCsv


AWSTemplateFormatVersion: '2010-09-09'
Description: QuickSight Datasets and Analyses for Clockify Weekly Reporting

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod

  QuickSightUsername:
    Type: String
    Description: QuickSight username (typically your IAM user or SSO identity)

  AwsAccountId:
    Type: String
    Description: AWS Account ID

  VpcConnectionArn:
    Type: String
    Description: ARN of the QuickSight VPC connection to the RDS database

  DatabaseHost:
    Type: String
    Description: RDS PostgreSQL endpoint

  DatabaseName:
    Type: String
    Default: clockify_reporting

  DatabaseUsername:
    Type: String
    Default: admin

  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Database password

Resources:
  # ============================================================
  # Data Source - PostgreSQL Connection
  # ============================================================
  ClockifyDataSource:
    Type: AWS::QuickSight::DataSource
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DataSourceId: !Sub clockify-datasource-${Environment}
      Name: !Sub Clockify PostgreSQL (${Environment})
      Type: POSTGRESQL
      DataSourceParameters:
        PostgreSqlParameters:
          Host: !Ref DatabaseHost
          Port: 5432
          Database: !Ref DatabaseName
      Credentials:
        CredentialPair:
          Username: !Ref DatabaseUsername
          Password: !Ref DatabasePassword
      VpcConnectionProperties:
        VpcConnectionArn: !Ref VpcConnectionArn
      SslProperties:
        DisableSsl: false
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSource
            - quicksight:DescribeDataSourcePermissions
            - quicksight:PassDataSource
            - quicksight:UpdateDataSource
            - quicksight:DeleteDataSource
            - quicksight:UpdateDataSourcePermissions

  # ============================================================
  # Dataset 1: Time Entries (Raw Data)
  # ============================================================
  TimeEntriesDataset:
    Type: AWS::QuickSight::DataSet
    DependsOn: ClockifyDataSource
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DataSetId: !Sub clockify-time-entries-${Environment}
      Name: !Sub Clockify Time Entries (${Environment})
      ImportMode: SPICE
      PhysicalTableMap:
        TimeEntriesTable:
          RelationalTable:
            DataSourceArn: !GetAtt ClockifyDataSource.Arn
            Schema: public
            Name: clockify_detailed_time_entries
            InputColumns:
              - Name: entry_id
                Type: INTEGER
              - Name: clockify_entry_id
                Type: STRING
              - Name: clockify_user_id
                Type: STRING
              - Name: user_name
                Type: STRING
              - Name: practice_alignment
                Type: STRING
              - Name: skill_area
                Type: STRING
              - Name: pod_assignment
                Type: STRING
              - Name: cloudelligent_title
                Type: STRING
              - Name: location
                Type: STRING
              - Name: employment_designation
                Type: STRING
              - Name: clockify_project_id
                Type: STRING
              - Name: project_name
                Type: STRING
              - Name: client_name
                Type: STRING
              - Name: description
                Type: STRING
              - Name: billable
                Type: BOOLEAN
              - Name: duration_seconds
                Type: INTEGER
              - Name: duration_hours
                Type: DECIMAL
              - Name: start_time
                Type: DATETIME
              - Name: end_time
                Type: DATETIME
              - Name: entry_date
                Type: DATETIME
              - Name: week_start_date
                Type: DATETIME
      LogicalTableMap:
        TimeEntriesLogical:
          Alias: Time Entries
          Source:
            PhysicalTableId: TimeEntriesTable
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions

  # ============================================================
  # Dataset 2: Resource Utilization View
  # ============================================================
  ResourceUtilizationDataset:
    Type: AWS::QuickSight::DataSet
    DependsOn: ClockifyDataSource
    Properties:
      AwsAccountId: !Ref AwsAccountId
      DataSetId: !Sub clockify-resource-utilization-${Environment}
      Name: !Sub Resource Utilization (${Environment})
      ImportMode: SPICE
      PhysicalTableMap:
        ResourceUtilizationTable:
          RelationalTable:
            DataSourceArn: !GetAtt ClockifyDataSource.Arn
            Schema: public
            Name: vw_resource_utilization
            InputColumns:
              - Name: week_start_date
                Type: DATETIME
              - Name: clockify_user_id
                Type: STRING
              - Name: user_name
                Type: STRING
              - Name: cloudelligent_title
                Type: STRING
              - Name: practice_alignment
                Type: STRING
              - Name: skill_area
                Type: STRING
              - Name: pod_assignment
                Type: STRING
              - Name: location
                Type: STRING
              - Name: employment_designation
                Type: STRING
              - Name: daily_capacity
                Type: DECIMAL
              - Name: weekly_capacity
                Type: DECIMAL
              - Name: actual_hours
                Type: DECIMAL
              - Name: utilization_percent
                Type: DECIMAL
              - Name: billable_hours
                Type: DECIMAL
              - Name: billable_percent
                Type: DECIMAL
      LogicalTableMap:
        ResourceUtilizationLogical:
          Alias: Resource Utilization
          Source:
            PhysicalTableId: ResourceUtilizationTable
      Permissions:
        - Principal: !Sub arn:aws:quicksight:${AWS::Region}:${AwsAccountId}:user/default/${QuickSightUsername}
          Actions:
            - quicksight:DescribeDataSet
            - quicksight:DescribeDataSetPermissions
            - quicksight:PassDataSet
            - quicksight:DescribeIngestion
            - quicksight:ListIngestions
            - quicksight:UpdateDataSet
            - quicksight:DeleteDataSet
            - quicksight:CreateIngestion
            - quicksight:CancelIngestion
            - quicksight:UpdateDataSetPermissions

  # ============================================================
  # Dataset 3: Weekly Time Summary View
  # ============================================================
